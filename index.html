<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Panel de la Residencia</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232E8B72'/%3E%3Cpath d='M5 19h14M7 19V10l5-4 5 4v9M10.5 19v-4h3v4' fill='none' stroke='white' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: sidebar de módulos + área de trabajo; cada módulo resume arriba y detalla abajo */
:root{
  --bg:#F3F5F4; --surface:#FFFFFF; --surface-2:#EEF2F0; --line:#DCE2DF; --line-strong:#C6D0CB;
  --fg:#16201C; --muted:#55645E; --accent:#1F6F5C; --accent-hover:#16503F; --on-accent:#FFFFFF;
  --nav-bg:#16201C; --nav-fg:#C9D6D0; --nav-strong:#FFFFFF; --nav-active:#2A3A33; --nav-soft:#202D28; --nav-muted:#A9BBB3;
  --ok-bg:#DCEDE6; --ok-fg:#1F5C4B; --info-bg:#DDE7F6; --info-fg:#1E4C8F; --info-line:#9DB6DD;
  --warn-bg:#F8E6D2; --warn-fg:#8A4511; --bad-bg:#F8DCCD; --bad-fg:#8F2F0A; --bad-line:#E9C4AE;
  --neu-bg:#E4E4E1; --neu-fg:#45453F; --scrim:rgba(22,32,28,.45); --shadow:0 18px 50px rgba(22,32,28,.22);
  --f-display:'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
  --f-body:'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#18211D; --surface-2:#1F2A25; --line:#2B3732; --line-strong:#3A4842;
  --fg:#E6EDEA; --muted:#9DB0A8; --accent:#4DB394; --accent-hover:#6FCCAE; --on-accent:#0B1512;
  --nav-bg:#0A0F0D; --nav-fg:#B5C5BE; --nav-strong:#FFFFFF; --nav-active:#1F2C27; --nav-soft:#141C19; --nav-muted:#8DA198;
  --ok-bg:#17362D; --ok-fg:#8FD6BC; --info-bg:#1A2C47; --info-fg:#A8C6F2; --info-line:#36507A;
  --warn-bg:#3D2A16; --warn-fg:#F0B983; --bad-bg:#42210F; --bad-fg:#F5A27C; --bad-line:#6B3A22;
  --neu-bg:#2B2E2C; --neu-fg:#C2C6C3; --scrim:rgba(0,0,0,.6); --shadow:0 18px 50px rgba(0,0,0,.5);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#18211D; --surface-2:#1F2A25; --line:#2B3732; --line-strong:#3A4842;
  --fg:#E6EDEA; --muted:#9DB0A8; --accent:#4DB394; --accent-hover:#6FCCAE; --on-accent:#0B1512;
  --nav-bg:#0A0F0D; --nav-fg:#B5C5BE; --nav-strong:#FFFFFF; --nav-active:#1F2C27; --nav-soft:#141C19; --nav-muted:#8DA198;
  --ok-bg:#17362D; --ok-fg:#8FD6BC; --info-bg:#1A2C47; --info-fg:#A8C6F2; --info-line:#36507A;
  --warn-bg:#3D2A16; --warn-fg:#F0B983; --bad-bg:#42210F; --bad-fg:#F5A27C; --bad-line:#6B3A22;
  --neu-bg:#2B2E2C; --neu-fg:#C2C6C3; --scrim:rgba(0,0,0,.6); --shadow:0 18px 50px rgba(0,0,0,.5);
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{color-scheme:light}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)} a:hover{color:var(--accent-hover)}
h1,h2,h3{text-wrap:balance}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

.app{display:flex;flex-wrap:wrap;min-height:100vh}
.nav{flex:1 1 236px;background:var(--nav-bg);color:var(--nav-fg);padding:26px 16px;display:flex;flex-direction:column;gap:28px}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px}
.brand-mark{width:40px;height:40px;flex:none;border-radius:10px;background:#2E8B72;display:grid;place-items:center}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:17px;color:var(--nav-strong);line-height:1.2}
.brand-sub{font-size:13px;color:var(--nav-muted)}
.brand-edit{background:none;border:none;padding:0;color:var(--nav-muted);font-size:13px;text-decoration:underline;cursor:pointer;min-height:24px}
.nav-links{display:flex;flex-direction:column;gap:4px}
.nav-link{display:flex;align-items:center;gap:12px;min-height:44px;padding:10px 14px;border-radius:10px;border:none;background:transparent;color:var(--nav-fg);font-size:15px;text-align:left;cursor:pointer;white-space:nowrap}
.nav-link:hover{background:var(--nav-soft);color:var(--nav-strong)}
.nav-link[aria-current="page"]{background:var(--nav-active);color:var(--nav-strong);font-weight:600}
.nav-foot{margin-top:auto;padding:14px;border-radius:12px;background:var(--nav-soft);display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--nav-muted)}
.nav-foot strong{font-family:var(--f-display);font-size:16px;color:var(--nav-strong);font-weight:600}
@media (max-width:760px){
  .nav{flex-basis:100%;padding:14px 16px;gap:12px}
  .nav-links{flex-direction:row;overflow-x:auto;padding-bottom:2px}
  .nav-foot{display:none}
}

.main{flex:999 1 560px;min-width:0;padding-block:24px 56px;padding-inline:clamp(16px,3vw,40px);display:flex;flex-direction:column;gap:24px}
.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.monthnav{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.monthnav span{min-width:150px;text-align:center;font-family:var(--f-display);font-weight:600;font-size:16px}
.icon-btn{width:40px;height:40px;display:grid;place-items:center;border-radius:9px;border:none;background:transparent;cursor:pointer;color:var(--fg)}
.icon-btn:hover{background:var(--surface-2)}
.ro{display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:20px;background:var(--info-bg);color:var(--info-fg);font-size:14px;font-weight:500}

.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.head h1{margin:0;font-family:var(--f-display);font-size:32px;font-weight:700;letter-spacing:-.5px;line-height:1.1}
.eyebrow{font-size:14px;color:var(--muted);margin-bottom:6px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);font-size:15px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--fg);color:var(--fg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);color:var(--on-accent)}
.btn.danger{background:var(--bad-fg);border-color:var(--bad-fg);color:var(--surface);font-weight:600}
.btn.small{min-height:40px;padding:0 12px;font-size:14px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.55;cursor:default}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:6px;text-align:left}
button.kpi{cursor:pointer;font:inherit;color:inherit} button.kpi:hover{border-color:var(--line-strong)}
.kpi-l{font-size:14px;color:var(--muted)}
.kpi-v{font-family:var(--f-display);font-size:30px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi-s{font-size:13px;color:var(--muted)}
.kpi.dark{background:var(--fg);color:var(--bg);border-color:var(--fg)} .kpi.dark .kpi-l{color:var(--bg);opacity:.75}
.c-bad{color:var(--bad-fg)} .c-ok{color:var(--ok-fg)} .c-warn{color:var(--warn-fg)}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 16px;border-radius:22px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);font-size:15px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg);font-weight:600}
.chip .num{font-size:13px;opacity:.8}
.seg{display:inline-flex;gap:4px;padding:4px;border-radius:12px;background:var(--surface-2)}
.seg button{min-height:40px;padding:0 14px;border-radius:9px;border:none;background:transparent;cursor:pointer;font-size:14px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.15)}

.split{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.split>.wide{flex:999 1 540px;min-width:0}
.split>.side{flex:1 1 300px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:14px}
.panel h2,.sec-h{margin:0;font-family:var(--f-display);font-size:19px;font-weight:600}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.muted{color:var(--muted)}
.small{font-size:13px}

.floor h3{margin:0;font-family:var(--f-display);font-size:17px;font-weight:600}
.floor h3 small{font-family:var(--f-body);font-size:14px;font-weight:400;color:var(--muted)}
.rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.room{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;text-align:left;font:inherit;color:inherit;width:100%}
button.room{cursor:pointer} button.room:hover{border-color:var(--line-strong);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.room.libre{border-style:dashed;border-color:var(--info-line)}
.room-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.room-num{font-family:var(--f-display);font-size:24px;font-weight:700}
.room hr{border:none;height:1px;background:var(--line);margin:0;width:100%}
.room-who{font-weight:500}

.pill{display:inline-block;padding:4px 10px;border-radius:12px;font-size:13px;font-weight:600;white-space:nowrap;line-height:1.3}
.p-ok{background:var(--ok-bg);color:var(--ok-fg)} .p-info{background:var(--info-bg);color:var(--info-fg)}
.p-warn{background:var(--warn-bg);color:var(--warn-fg)} .p-bad{background:var(--bad-bg);color:var(--bad-fg)} .p-neu{background:var(--neu-bg);color:var(--neu-fg)}

.list{list-style:none;margin:0;padding:0}
.list li{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)} .list li:last-child{border-bottom:none}
.datebox{width:52px;flex:none;text-align:center;border-radius:10px;padding:6px 0;line-height:1.1}
.datebox b{display:block;font-family:var(--f-display);font-size:20px}
.datebox small{font-size:12px;font-weight:600;text-transform:uppercase}

.tablebox{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:15px}
th{text-align:left;color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:600;padding:13px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
td.r,th.r{text-align:right}
tr.sel{background:var(--surface-2)}
.who{min-height:44px;display:flex;align-items:center;gap:12px;padding:0;border:none;background:transparent;cursor:pointer;text-align:left;font-weight:600}
.av{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:600;background:var(--surface-2);color:var(--fg)}
tr.sel .av{background:var(--accent);color:var(--on-accent)}
tr.sel td{border-bottom-color:transparent}
.who .chev{color:var(--muted);transition:transform .15s ease;flex:none}
tr.sel .who .chev{transform:rotate(180deg)}
tr.expand td{padding:0 14px 16px;background:var(--surface-2)}
.ficha{position:sticky;left:0;max-width:calc(100vw - 64px);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:16px}
.ficha-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 28px}
.ficha-grid>div{min-width:0}
.search{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);flex:1 1 220px;max-width:340px}
.search input{border:none;outline:none;background:transparent;width:100%;min-width:0}
.check{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:14px;cursor:pointer}

.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:15px}
.kv>span:first-child{color:var(--muted)}
.kv>span:last-child{text-align:right;overflow-wrap:anywhere}
.lbl{margin:0;font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.divider{height:1px;background:var(--line)}
.bigav{width:56px;height:56px;flex:none;border-radius:50%;background:var(--ok-bg);color:var(--ok-fg);display:grid;place-items:center;font-family:var(--f-display);font-size:20px;font-weight:700}

.followups{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.fu{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}
.fu.bad{border-color:var(--bad-line)}
.fu-amt{font-family:var(--f-mono);font-size:22px}
.fu .actions .btn{flex:1 1 120px}

.kanban{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;align-items:start}
.col{background:var(--surface-2);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:2px 4px}
.col-h h3{margin:0;font-size:15px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.card .actions .btn{flex:1 1 auto}

.empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:14px;padding:32px 24px;display:flex;flex-direction:column;align-items:flex-start;gap:12px;max-width:640px}
.empty h2{margin:0;font-family:var(--f-display);font-size:22px}
.empty p{margin:0;color:var(--muted);max-width:60ch}
.note{margin:0;padding:14px 16px;border:1px dashed var(--line-strong);border-radius:12px;color:var(--muted);font-size:14px}

.modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:min(560px,100%);max-height:calc(100% - 32px);overflow:auto;background:var(--surface);border-radius:16px;box-shadow:var(--shadow)}
.sheet form{display:flex;flex-direction:column}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 6px}
.sheet-h h2{margin:0;font-family:var(--f-display);font-size:21px}
.sheet-b{padding:12px 20px;display:flex;flex-direction:column;gap:14px}
.sheet-f{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:10px;padding:12px 20px 20px}
.ferr{margin:0 20px;padding:10px 12px;border-radius:10px;background:var(--bad-bg);color:var(--bad-fg);font-size:14px}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;min-width:0}
.f input,.f select,.f textarea{min-height:44px;padding:8px 12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);font-size:15px;font-weight:400;width:100%}
.f textarea{min-height:80px;resize:vertical}
.f small{font-weight:400;color:var(--muted);font-size:13px}
.radios{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.radios label{min-height:44px;display:flex;align-items:center;gap:8px;padding:0 12px;border-radius:10px;border:1px solid var(--line-strong);font-size:14px;cursor:pointer}
.radios label:has(input:checked){border-color:var(--fg);font-weight:600}
fieldset{border:none;margin:0;padding:0;min-width:0} legend{font-size:14px;font-weight:500;padding:0;margin-bottom:6px}
.toggle{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px;cursor:pointer}
.toggle input{width:20px;height:20px}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:15px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.state{padding:48px 0;color:var(--muted);font-size:16px}

/* Densidad compacta: misma identidad, menos altura por bloque */
body{font-size:14px}
.nav{flex-basis:208px;padding:18px 12px;gap:20px}
.brand{gap:10px;padding:0 6px}
.brand-mark{width:34px;height:34px;border-radius:9px}
.brand-name{font-size:15px}
.brand-sub{font-size:12px}
.nav-link{min-height:38px;padding:7px 12px;font-size:14px;gap:10px}
.nav-link svg{width:18px;height:18px}
.nav-foot{padding:10px 12px;font-size:12px}
.nav-foot strong{font-size:14px}
.main{padding-block:16px 32px;gap:14px}
.head{align-items:center;gap:10px}
.head h1{font-size:23px;letter-spacing:-.3px}
.eyebrow{font-size:12.5px;margin-bottom:2px}
.head-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.month-slot:empty{display:none}
.monthnav{padding:2px;border-radius:10px;gap:2px}
.monthnav span{min-width:118px;font-size:14px}
.icon-btn{width:34px;height:34px;border-radius:8px}
.ro{padding:5px 12px;font-size:13px}
.btn{min-height:36px;padding:0 14px;font-size:14px;border-radius:9px;gap:6px}
.btn svg{width:16px;height:16px}
.btn.small{min-height:30px;padding:0 10px;font-size:13px;border-radius:8px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}
.kpi{padding:11px 14px;gap:3px;border-radius:12px}
.kpi-l{font-size:12.5px}
.kpi-v{font-size:22px}
.kpi-s{font-size:12.5px}
.bar{height:6px}
.chips{gap:6px}
.chip{min-height:32px;padding:0 12px;font-size:13.5px;border-radius:16px;gap:6px}
.chip .num{font-size:12px}
.seg{padding:3px;border-radius:10px;flex-wrap:wrap}
.seg button{min-height:30px;padding:0 11px;font-size:13px;border-radius:8px}
.split{gap:16px}
.split>.wide{flex-basis:520px}
.split>.side{flex-basis:250px}
.panel{padding:14px 16px;gap:10px;border-radius:12px}
.panel h2,.sec-h{font-size:16px}
.sec{gap:8px}
.floor h3{font-size:14.5px}
.floor h3 small{font-size:12.5px}
.rooms{grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.room{padding:10px 12px;gap:2px;border-radius:10px}
.room-num{font-size:18px}
.room hr{display:none}
.room .small{font-size:12px}
.room-who{font-size:13.5px;margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

<body>

<div class="auth" id="auth" hidden>
  <div class="auth-card">
    <div class="auth-brand">
      <div class="brand-mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"/><path d="M5 21V8l7-5 7 5v13"/><path d="M10 21v-5h4v5"/></svg></div>
      <div><h1 id="authTitle">Entrar</h1><div class="muted small">Panel de la residencia</div></div>
    </div>
    <p class="auth-msg" id="authMsg" role="alert" hidden></p>
    <form id="authForm" novalidate>
      <label class="f" for="a-email" id="a-email-wrap">Correo<input id="a-email" name="email" type="email" autocomplete="email" required></label>
      <label class="f" for="a-pass" id="a-pass-wrap">Contraseña<input id="a-pass" name="password" type="password" autocomplete="current-password" minlength="6" required></label>
      <button type="submit" class="btn primary" id="authSubmit">Entrar</button>
    </form>
    <div style="display:flex;flex-direction:column;gap:2px" id="authLinks">
      <button type="button" class="linkbtn" id="toSignup">¿Primera vez? Crea tu cuenta con el correo invitado</button>
      <button type="button" class="linkbtn" id="toReset">Olvidé mi contraseña</button>
      <button type="button" class="linkbtn" id="toLogin" hidden>Volver a entrar</button>
    </div>
    <div id="noAccess" hidden style="display:flex;flex-direction:column;gap:12px">
      <p style="margin:0">Tu cuenta <strong id="naEmail"></strong> todavía no tiene acceso a esta residencia. Pide a la administración que invite este correo y vuelve a entrar.</p>
      <button type="button" class="btn" id="naOut">Cerrar sesión</button>
    </div>
  </div>
</div>

<div class="app" id="app" hidden>
  <nav class="nav" aria-label="Módulos">
    <div class="brand">
      <div class="brand-mark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"/><path d="M5 21V8l7-5 7 5v13"/><path d="M10 21v-5h4v5"/></svg></div>
      <div>
        <div class="brand-name" id="resName">Mi residencia</div>
        <div class="brand-sub" id="resSub">Administración</div>
        <button type="button" class="brand-edit" id="resEdit" data-act="settings" hidden>Cambiar nombre</button>
      </div>
    </div>
    <div class="nav-links">
      <button type="button" class="nav-link" data-act="view" data-v="rooms">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17"/><path d="M2 21h20"/><path d="M16 9h3a1 1 0 0 1 1 1v11"/><circle cx="12.5" cy="12" r=".8"/></svg>Habitaciones</button>
      <button type="button" class="nav-link" data-act="view" data-v="tenants">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.8c1.9.7 3.1 2.4 3.5 5.2"/></svg>Inquilinos</button>
      <button type="button" class="nav-link" data-act="view" data-v="payments">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M2.5 10h19"/><path d="M6.5 15h4"/></svg>Pagos</button>
      <button type="button" class="nav-link" data-act="view" data-v="expenses">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3.5 17.5a1.4 1.4 0 0 0 2 2l5.8-5.8a4 4 0 0 0 5.4-5.4l-2.5 2.5-2-2z"/></svg>Gastos y mantenimiento</button>
      <button type="button" class="nav-link" data-act="view" data-v="partner">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>Reparto</button>
    </div>
    <div class="nav-foot"><span>Hoy</span><strong id="todayLbl"></strong></div>
    <div class="nav-user">
      <span id="userEmail"></span>
      <button type="button" data-act="access" id="accessBtn" hidden>Acceso de personas</button>
      <button type="button" data-act="signOut" id="signOutBtn">Cerrar sesión</button>
    </div>
  </nav>

  <main class="main">
    <div class="topbar" id="topbar">
      <div class="monthnav" id="monthnav" role="group" aria-label="Mes">
        <button type="button" class="icon-btn" data-act="month" data-d="-1" aria-label="Mes anterior"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg></button>
        <span id="monthLbl" aria-live="polite"></span>
        <button type="button" class="icon-btn" data-act="month" data-d="1" aria-label="Mes siguiente"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></button>
      </div>
      <span class="ro" id="roBadge" hidden><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>Modo consulta: solo la administración edita</span>
    </div>
    <div id="view"><p class="state">Cargando datos de la residencia…</p></div>
  </main>
</div>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function(){
'use strict';
var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
var MES3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
var COLS=['rooms','tenants','payments','expenses','incidents','envios'];
var METODOS=['Zelle','Pago móvil','Transferencia','Efectivo','Otro'];
var TIPOS=['Individual','Doble','Triple','Suite'];
var CATS=['Electricidad','Agua','Internet','Gas','Limpieza','Mantenimiento','Reparaciones','Impuestos','Otros'];

function pad(n){return String(n).padStart(2,'0')}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function curMonth(){return today().slice(0,7)}
function dim(M){var p=M.split('-').map(Number);return new Date(p[0],p[1],0).getDate()}
function firstDay(M){return M+'-01'}
function lastDay(M){return M+'-'+pad(dim(M))}
function shiftMonth(M,k){var p=M.split('-').map(Number),y=p[0],m=p[1]+k;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+'-'+pad(m)}
function mLabel(M){var p=M.split('-').map(Number);var n=MESES[p[1]-1];return n.charAt(0).toUpperCase()+n.slice(1)+' '+p[0]}
function mShort(M){var p=M.split('-').map(Number);return MES3[p[1]-1]+' '+p[0]}
function fmtD(s){if(!s)return '—';var p=s.split('-').map(Number);return p[2]+' '+MES3[p[1]-1]+' '+p[0]}
function fmtDs(s){if(!s)return '—';var p=s.split('-').map(Number);return p[2]+' '+MES3[p[1]-1]}
function utc(s){var p=s.split('-').map(Number);return Date.UTC(p[0],p[1]-1,p[2])}
function days(a,b){return Math.round((utc(b)-utc(a))/864e5)}
function addDays(s,n){var d=new Date(utc(s)+n*864e5);return d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate())}
function money(n){n=Number(n)||0;return '$'+(Math.round(n*100)/100).toLocaleString('es-VE',{maximumFractionDigits:2})}
function toNum(v){var n=parseFloat(String(v==null?'':v).replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:NaN}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function ini(n){return String(n||'?').trim().split(/\s+/).map(function(w){return w.charAt(0)}).join('').slice(0,2).toUpperCase()}
function byNum(a,b){return (Number(a.piso)||0)-(Number(b.piso)||0)||String(a.num).localeCompare(String(b.num),'es',{numeric:true})}
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

var S={rooms:[],tenants:[],payments:[],expenses:[],incidents:[],envios:[],config:{},loaded:{},
  view:lsGet('res.view')||'rooms',month:curMonth(),filter:'todas',sel:null,q:'',past:false,ptab:'todos',
  owner:false,db:null,dl:null,failed:false};
if(['rooms','tenants','payments','expenses','partner'].indexOf(S.view)<0)S.view='rooms';

/* ---------- dominio ---------- */
function roomById(id){return S.rooms.find(function(r){return r.id===id})}
function tenantById(id){return S.tenants.find(function(t){return t.id===id})}
function isCurrent(t){var d=today();return !t.salida||t.salida>=d}
function activeIn(t,M){return t.entrada&&t.entrada<=lastDay(M)&&(!t.salida||t.salida>=firstDay(M))}
function roomTenant(r){return S.tenants.find(function(t){return t.roomId===r.id&&isCurrent(t)})}
function roomNum(id){var r=roomById(id);return r?r.num:'—'}
function paidBy(tid,M){return S.payments.reduce(function(s,p){return s+(p.tenantId===tid&&p.mes===M?(Number(p.monto)||0):0)},0)}
function payStatus(t,M){
  if(!activeIn(t,M))return null;
  var renta=Number(t.renta)||0,paid=paidBy(t.id,M),debe=Math.max(0,renta-paid);
  var dia=Math.min(Math.max(1,Number(t.diaPago)||1),dim(M));var due=M+'-'+pad(dia);
  if(t.entrada>due)due=t.entrada;
  var late=Math.max(0,days(due,today()));
  var o={renta:renta,paid:paid,debe:debe,due:due,late:late};
  if(debe<=0){o.k='pagado';o.label='Pagado';o.cls='p-ok'}
  else if(paid>0&&late>0){o.k='parcial';o.label='Vencido · debe '+money(debe);o.cls='p-bad'}
  else if(paid>0){o.k='abonado';o.label='Abonó '+money(paid)+' · faltan '+money(debe)+' · vence '+fmtDs(due);o.cls='p-info'}
  else if(late>0){o.k='vencido';o.label='Vencido · '+late+(late===1?' día':' días');o.cls='p-bad'}
  else{o.k='pendiente';o.label='Vence '+fmtDs(due);o.cls='p-neu'}
  return o;
}
function roomInfo(r){
  var t=roomTenant(r),d=today();
  if(t&&t.entrada<=d){
    var ps=payStatus(t,curMonth()),nota='Contrato hasta '+fmtD(t.fin);
    if(ps&&ps.k==='vencido')nota='Pago vencido hace '+ps.late+(ps.late===1?' día':' días');
    else if(ps&&ps.k==='parcial')nota='Abonó '+money(ps.paid)+', debe '+money(ps.debe)+' vencido';
    else if(ps&&ps.k==='abonado')nota='Abonó '+money(ps.paid)+', faltan '+money(ps.debe);
    else if(t.fin&&days(d,t.fin)>=0&&days(d,t.fin)<=30)nota='Contrato vence '+fmtDs(t.fin);
    if(r.mant)nota='En mantenimiento · '+nota;
    return {k:'ocupada',label:'Ocupada',cls:'p-ok',who:t.nombre,nota:nota,t:t};
  }
  if(t)return {k:'reservada',label:'Reservada',cls:'p-warn',who:t.nombre,nota:'Entra el '+fmtD(t.entrada),t:t};
  if(r.mant)return {k:'mant',label:'Mantenimiento',cls:'p-neu',who:'Fuera de servicio',nota:r.nota||'En reparación'};
  return {k:'libre',label:'Libre',cls:'p-info',who:'Disponible',nota:r.nota||'Lista para ocupar'};
}
function monthTotals(M){
  var esperado=0,pend=0,deud=0;
  S.tenants.forEach(function(t){var ps=payStatus(t,M);if(!ps)return;esperado+=ps.renta;pend+=ps.debe;if(ps.debe>0&&(ps.k==='vencido'||ps.k==='parcial'))deud++});
  var cobrado=S.payments.reduce(function(s,p){return s+(p.mes===M?(Number(p.monto)||0):0)},0);
  var gastos=S.expenses.reduce(function(s,e){return s+((e.fecha||'').slice(0,7)===M?(Number(e.monto)||0):0)},0);
  return {esperado:esperado,cobrado:cobrado,pend:pend,deud:deud,gastos:gastos};
}
function openIncidents(){return S.incidents.filter(function(i){return i.estado!=='resuelta'})}

/* ---------- piezas ---------- */
function pill(cls,txt){return '<span class="pill '+cls+'">'+esc(txt)+'</span>'}
function plusIcon(){return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>'}
function head(eyebrow,title,actions){return '<header class="head"><div><div class="eyebrow">'+esc(eyebrow)+'</div><h1>'+esc(title)+'</h1></div><div class="head-tools"><span class="month-slot"></span>'+(actions?'<div class="actions">'+actions+'</div>':'')+'</div></header>'}
function kpi(l,v,s,cls,act){var tag=act?'button type="button" '+act:'div';var end=act?'button':'div';return '<'+tag+' class="kpi'+(cls&&cls.indexOf('dark')>-1?' dark':'')+'"><span class="kpi-l">'+esc(l)+'</span><span class="kpi-v '+(cls||'')+'">'+v+'</span>'+(s?'<span class="kpi-s">'+s+'</span>':'')+'</'+end+'>'}
function btn(label,act,extra,cls){return '<button type="button" class="btn '+(cls||'')+'" data-act="'+act+'" '+(extra||'')+'>'+label+'</button>'}
function waNum(tel){var d=String(tel||'').replace(/\D/g,'');if(!d)return '';if(d.charAt(0)==='0')d='58'+d.slice(1);else if(d.length===10&&d.indexOf('58')!==0)d='58'+d;return d}
function reminderText(t,ps,M){var r=roomById(t.roomId);return 'Hola '+String(t.nombre||'').split(' ')[0]+', te escribimos de '+(S.config.nombre||'la residencia')+'. Te recordamos que el pago de la habitación '+(r?r.num:'')+' correspondiente a '+mLabel(M).toLowerCase()+' está pendiente por '+money(ps.debe)+'. ¡Gracias!'}

/* ---------- vistas ---------- */
var V={};
V.rooms=function(){
  var M=S.month,own=S.owner;
  var acts=own?btn('Crear varias','bulkRooms')+btn(plusIcon()+'Nueva habitación','newRoom','','primary'):'';
  var rooms=S.rooms.slice().sort(byNum);
  if(!rooms.length){
    return head('Inicio','Habitaciones','')+'<section class="empty"><h2>Aún no hay habitaciones</h2><p>'+(own?'Agrega las habitaciones de la residencia una por una, o crea un piso completo de una vez indicando el primer número y cuántas son.':'La administración todavía no ha cargado habitaciones. Cuando lo haga aparecerán aquí automáticamente.')+'</p>'+(own?'<div class="actions">'+btn('Crear varias a la vez','bulkRooms')+btn(plusIcon()+'Agregar habitación','newRoom','','primary')+'</div>':'')+'</section>';
  }
  var info=rooms.map(function(r){return {r:r,i:roomInfo(r)}});
  var c={todas:info.length,ocupada:0,libre:0,reservada:0,mant:0};
  info.forEach(function(x){c[x.i.k]++});
  var pct=Math.round(c.ocupada/info.length*100),T=monthTotals(M),inc=openIncidents().length;
  var h=head('Ocupación al '+fmtD(today()),'Habitaciones',acts);

function tenantList(){
  var q=S.q.trim().toLowerCase();
  return S.tenants.filter(function(t){return (S.past||isCurrent(t))&&(!q||String(t.nombre||'').toLowerCase().indexOf(q)>-1||String(roomNum(t.roomId)).toLowerCase().indexOf(q)>-1)})
    .sort(function(a,b){var ra=roomById(a.roomId)||{},rb=roomById(b.roomId)||{};return byNum(ra,rb)||String(a.nombre).localeCompare(String(b.nombre),'es')});
}
function tenantRows(){

    var ps=payStatus(t,M),on=S.sel===t.id,cur=isCurrent(t);

document.addEventListener('change',function(e){
  if(e.target.id==='past'){S.past=e.target.checked;render()}
  if(e.target.id==='f-roomId'){var r=roomById(e.target.value),inp=document.getElementById('f-renta');if(r&&inp)inp.value=r.precio}
  if(e.target.id==='f-tenantId'){var t=tenantById(e.target.value),mi=document.getElementById('f-mes'),mo=document.getElementById('f-monto');if(t&&mo&&payKind!=='abono'){var ps=payStatus(t,mi&&mi.value||S.month);mo.value=ps?(ps.debe||ps.renta):t.renta}updPayInfo()}
  if(e.target.id==='f-mes')updPayInfo();
});
var toastT=0;
function toast(msg){var t=document.getElementById('toast');t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(function(){t.hidden=true},3200)}

/* ---------- acceso ---------- */
var authMode='login',channel=null,currentUser=null;
var $=function(id){return document.getElementById(id)};
function authMsg(txt,kind){var m=$('authMsg');if(!txt){m.hidden=true;return}m.textContent=txt;m.className='auth-msg '+(kind||'err');m.hidden=false}
function setAuthMode(mode){
  authMode=mode;authMsg('');
  var t={login:['Entrar','Entrar'],signup:['Crear cuenta','Crear cuenta'],reset:['Recuperar contraseña','Enviar enlace'],newpass:['Nueva contraseña','Guardar contraseña']}[mode];
  $('authTitle').textContent=t[0];$('authSubmit').textContent=t[1];
  $('a-email-wrap').hidden=mode==='newpass';$('a-pass-wrap').hidden=mode==='reset';
  $('a-pass').setAttribute('autocomplete',mode==='login'?'current-password':'new-password');
  $('toSignup').hidden=mode!=='login';$('toReset').hidden=mode!=='login';$('toLogin').hidden=mode==='login'||mode==='newpass';
  $('authForm').hidden=false;$('authLinks').hidden=false;$('noAccess').hidden=true;
}
function showAuth(mode){
  $('app').hidden=true;$('auth').hidden=false;setAuthMode(mode||'login');
  if(channel){sb.removeChannel(channel);channel=null}
  S.db=null;S.loaded={};COLS.forEach(function(c){S[c]=[]});
}
function showNoAccess(email){
  $('app').hidden=true;$('auth').hidden=false;$('authTitle').textContent='Sin acceso';authMsg('');
  $('authForm').hidden=true;$('authLinks').hidden=true;$('naEmail').textContent=email;$('noAccess').hidden=false;
}
function authErr(e){
  var m=(e&&e.message||'').toLowerCase();
  if(m.indexOf('invalid login')>-1)return 'Correo o contraseña incorrectos.';
  if(m.indexOf('email not confirmed')>-1)return 'Primero confirma tu correo con el enlace que te enviamos.';
  if(m.indexOf('already registered')>-1)return 'Ese correo ya tiene cuenta. Usa «Volver a entrar».';
  if(m.indexOf('password')>-1&&m.indexOf('6')>-1)return 'La contraseña debe tener al menos 6 caracteres.';
  if(m.indexOf('rate limit')>-1)return 'Demasiados intentos. Espera unos minutos y vuelve a intentarlo.';
  return e&&e.message?e.message:'No se pudo completar. Revisa tu conexión.';
}
$('toSignup').onclick=function(){setAuthMode('signup')};
$('toReset').onclick=function(){setAuthMode('reset')};
$('toLogin').onclick=function(){setAuthMode('login')};
$('naOut').onclick=function(){sb.auth.signOut()};
$('authForm').addEventListener('submit',function(e){
  e.preventDefault();
  var email=$('a-email').value.trim().toLowerCase(),pass=$('a-pass').value,btnS=$('authSubmit');
  var here=location.origin+location.pathname;
  if(authMode!=='newpass'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){authMsg('Escribe un correo válido.');return}
  if(authMode!=='reset'&&pass.length<6){authMsg('La contraseña debe tener al menos 6 caracteres.');return}
  btnS.disabled=true;authMsg('');
  var p;
  if(authMode==='login')p=sb.auth.signInWithPassword({email:email,password:pass});
  else if(authMode==='signup')p=sb.auth.signUp({email:email,password:pass,options:{emailRedirectTo:here}}).then(function(r){if(r.error)return r;if(!r.data.session){authMsg('Te enviamos un correo a '+email+'. Abre el enlace para confirmar tu cuenta y luego entra aquí.','ok');setTimeout(function(){authMode='login';$('authTitle').textContent='Entrar';$('authSubmit').textContent='Entrar';$('toSignup').hidden=false;$('toReset').hidden=false;$('toLogin').hidden=true;$('a-pass').value=''},0)}return r});
  else if(authMode==='reset')p=sb.auth.resetPasswordForEmail(email,{redirectTo:here}).then(function(r){if(!r.error)authMsg('Si ese correo tiene cuenta, te llegará un enlace para crear una contraseña nueva.','ok');return r});
  else p=sb.auth.updateUser({password:pass}).then(function(r){if(!r.error){toast('Contraseña actualizada');history.replaceState(null,'',here);start()}return r});
  p.then(function(r){btnS.disabled=false;if(r&&r.error)authMsg(authErr(r.error))}).catch(function(err){btnS.disabled=false;authMsg(authErr(err))});
});

function enterApp(user){
  if(currentUser&&currentUser.id===user.id)return;
  currentUser=user;S.email=(user.email||'').toLowerCase();
  api.from('members').select('role').eq('user_id',user.id).maybeSingle().then(function(r){
    if(r.error){showAuth('login');authMsg('No se pudo verificar tu acceso. Revisa tu conexión y vuelve a entrar.');return}
    if(!r.data){showNoAccess(S.email);return}
    S.owner=r.data.role==='admin';S.db=sb;
    $('auth').hidden=true;$('app').hidden=false;
    $('userEmail').textContent=S.email;$('accessBtn').hidden=!S.owner;$('signOutBtn').hidden=false;
    render();
    COLS.forEach(reload);reload('config');
    if(channel)sb.removeChannel(channel);
    channel=sb.channel('residencia');
    COLS.concat(['config']).forEach(function(t){channel.on('postgres_changes',{event:'*',schema:'public',table:t},function(){reload(t)})});
    channel.subscribe();
  });
}
function linkError(){
  var h=location.hash||'';if(h.indexOf('error=')<0)return '';
  var p=new URLSearchParams(h.slice(1)),code=p.get('error_code')||p.get('error')||'';
  history.replaceState(null,'',location.origin+location.pathname);
  if(code==='otp_expired')return 'Ese enlace del correo ya se usó o venció. Si ya confirmaste tu cuenta, entra con tu correo y contraseña. Si no, pide un correo nuevo y abre el más reciente.';
  return 'El enlace del correo no es válido. Entra con tu correo y contraseña o pide uno nuevo.';
}
function enterGuest(tok){
  guest=true;api=guestClient(tok);currentUser={id:'guest'};
  api.from('config').select('nombre').eq('id',1).maybeSingle().then(function(r){
    if(r.error||!r.data){
      guest=false;api=sb;currentUser=null;lsSet('res.guest','');
      history.replaceState(null,'',location.origin+location.pathname);
      showAuth('login');authMsg(r.error&&isNetErr(r.error)?'No se pudo conectar. Revisa tu conexión y recarga la página.':'Este enlace de invitado ya no es válido. Pide el enlace nuevo a la administración.');
      return;
    }
    lsSet('res.guest',tok);
    S.owner=false;S.email='';S.db=api;
    $('auth').hidden=true;$('app').hidden=false;
    $('userEmail').textContent='Invitado · solo lectura';$('accessBtn').hidden=true;$('signOutBtn').hidden=true;
    render();COLS.forEach(reload);reload('config');
    clearInterval(guestPoll);guestPoll=setInterval(function(){if(!document.hidden){COLS.forEach(reload);reload('config')}},30000);
  });
}
function start(){
  var gm=(location.hash||'').match(/invitado=([A-Za-z0-9_-]{8,})/);
  if(gm){enterGuest(gm[1]);return}
  var le=linkError();
  if(le){sb.auth.getSession().then(function(r){var s=r.data&&r.data.session;if(s)enterApp(s.user);else{showAuth('login');authMsg(le)}});return}
  sb.auth.getSession().then(function(r){var s=r.data&&r.data.session;if(s){enterApp(s.user);return}var saved=lsGet('res.guest');if(saved)enterGuest(saved);else showAuth('login')});
}
sb.auth.onAuthStateChange(function(ev,session){
  if(guest)return;
  if(ev==='PASSWORD_RECOVERY'){currentUser=null;showAuth('newpass');return}
  if(ev==='SIGNED_OUT'){currentUser=null;showAuth('login');return}
  if((ev==='SIGNED_IN'||ev==='INITIAL_SESSION')&&session&&authMode!=='newpass')setTimeout(function(){enterApp(session.user)},0);
});
document.addEventListener('visibilitychange',function(){if(!document.hidden&&S.db){COLS.forEach(reload);reload('config')}});
start();
})();
</script>
