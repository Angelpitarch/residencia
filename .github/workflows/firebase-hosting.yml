# Publica la app en https://lacomadre.web.app cada vez que se actualiza la rama main.
# Necesita el secreto FIREBASE_SERVICE_ACCOUNT (clave JSON de una cuenta de servicio
# con el rol "Administrador de Firebase Hosting"). Sin el secreto, no publica nada.
name: Publicar en Firebase Hosting
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  publicar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Comprobar credencial
        id: cred
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -n "$SA" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "::warning::Falta el secreto FIREBASE_SERVICE_ACCOUNT; no se publica."; fi
      - name: Publicar en lacomadre.web.app
        if: steps.cred.outputs.ok == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          set +e
          npx --yes firebase-tools@13 deploy --only hosting:lacomadre --project residencia-ae9f0 --non-interactive > "$RUNNER_TEMP/out.txt" 2>&1
          code=$?
          cat "$RUNNER_TEMP/out.txt"
          rm -f "$RUNNER_TEMP/sa.json"
          if [ $code -ne 0 ]; then
            msg=$(grep -iE "error|denied|permission|not found|invalid" "$RUNNER_TEMP/out.txt" | tail -n 6 | tr '\n' ' ' | cut -c1-900)
            echo "::error::Fallo al publicar: ${msg:-ver registro}"
            exit $code
          fi
